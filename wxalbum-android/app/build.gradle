plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.wxalbum.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.wxalbum.app"
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName "1.5"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        // 固定签名：证书由 CI 从 GitHub Secret(KEYSTORE_BASE64) 还原到 keystore/wxalbum.p12
        // 密码可用 Secret KEYSTORE_PASSWORD 覆盖，缺省值仅用于本地构建
        release {
            storeFile file("../keystore/wxalbum.p12")
            storePassword System.getenv("WXALBUM_KEYSTORE_PASSWORD") ?: "wxalbum2026"
            keyAlias "wxalbum"
            keyPassword System.getenv("WXALBUM_KEYSTORE_PASSWORD") ?: "wxalbum2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
