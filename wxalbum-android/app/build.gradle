plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.wxalbum.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.wxalbum.app"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
