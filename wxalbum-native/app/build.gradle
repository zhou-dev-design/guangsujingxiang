plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wxalbum.nativeapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.wxalbum.nativeapp"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
        // 纯 Java 实现，不引入任何第三方运行时
    }

    signingConfigs {
        release {
            storeFile file("../keystore/wxalbum.p12")
            storePassword System.getenv("WXALBUM_KEYSTORE_PASSWORD") ?: "wxalbum2026"
            keyAlias "wxalbum"
            keyPassword System.getenv("WXALBUM_KEYSTORE_PASSWORD") ?: "wxalbum2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }
}
