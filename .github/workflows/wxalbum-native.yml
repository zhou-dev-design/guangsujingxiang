name: 构建公众号转EPUB 原生版

on:
  push:
    paths:
      - "wxalbum-native/**"
      - ".github/workflows/wxalbum-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包原生 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 还原签名证书
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS=wxalbum-native/keystore/wxalbum.p12
          mkdir -p wxalbum-native/keystore
          if [ -n "${KEYSTORE_B64}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "签名证书已从 Secrets 还原"
          elif [ -f "$KS" ]; then
            echo "::warning::未配置 Secret，使用仓库内证书"
          else
            echo "::error::缺少签名证书"
            exit 1
          fi

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          if [ -n "$SM" ]; then
            chmod +x "$SM" || true
            yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
            "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 构建 release APK
        id: build
        continue-on-error: true
        working-directory: wxalbum-native
        env:
          WXALBUM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: 编译失败时把日志推到 ci-logs 分支
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/build.log build-error.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f build-error.log
          git commit -m "ci: 编译错误日志" || true
          git push -f origin ci-logs
          exit 1

      - name: 校验签名
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find wxalbum-native/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          BT="$(ls -d ${ANDROID_HOME}/build-tools/* 2>/dev/null | sort -V | tail -1)"
          if [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
            {
              echo "### 原生版 APK"
              echo "- 大小: $(du -h "$APK" | cut -f1)"
              echo '```'
              cat /tmp/certs.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 收集产物
        run: |
          mkdir -p dist
          APK=$(find wxalbum-native/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" dist/wxalbum-native.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wxalbum-native-apk
          path: dist/*.apk

      - name: 发布到 Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wxalbum-native-latest
          name: 公众号转EPUB 原生版（纯 Java）
          body: |
            纯 Java 实现，不打包 Python 运行时，体积远小于 Chaquopy 版。
            包名独立（com.wxalbum.nativeapp），可以与旧版同时安装。
          files: dist/wxalbum-native.apk
          make_latest: false
