plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.wxalbum.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.wxalbum.app"
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName "1.4"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        // 固定签名：CI 上每次用同一把钥匙，才能覆盖升级
        release {
            storeFile file("../keystore/wxalbum.p12")
            storePassword "wxalbum2026"
            keyAlias "wxalbum"
            keyPassword "wxalbum2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
