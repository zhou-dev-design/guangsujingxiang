name: 构建与发布

# 打个 tag 就出成品：安卓 APK + Rust 桌面 exe，连同 Python 版 exe 一起发到 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: 安卓 APK（原版 Java）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 装 platform 与 build-tools
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # 优先 36，装不上就退回 35；脚本自己会挑已装的最高版本
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            || sdkmanager "platforms;android-35" "build-tools;35.0.0"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: 构建 APK
        shell: bash
        run: bash app-source/build-apk.sh

      - name: 检查产物
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          APK="$(ls release/*.apk | head -1)"
          echo "apk: $APK"
          ls -lh "$APK"
          "$AAPT" dump badging "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release/*.apk
          if-no-files-found: error

  windows:
    name: 桌面 EXE（Rust + Tauri）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri

      - name: 构建便携 exe
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tauri build --no-bundle --ci
          ls -lh src-tauri/target/release/*.exe

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          V="$(node -p "require('./rust/src-tauri/tauri.conf.json').version")"
          mkdir -p dist
          cp rust/src-tauri/target/release/lightmirror.exe "dist/LightMirror-Desktop-${V}-rust.exe"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: 发布（3 个成品放一起）
    needs: [apk, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 补上 Python 版 exe
        shell: bash
        run: |
          set -euo pipefail
          PY="$(ls release/LightMirror-Desktop-*.exe | grep -v rust | tail -1)"
          cp "$PY" dist/
          ls -lh dist

      - name: 清掉旧 Release，再发新的
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          # 同 tag 的旧发布先删（保留 tag），其它 tag 的发布连 tag 一起删
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r t; do
            [ -z "$t" ] && continue
            [ "$t" = "$TAG" ] && continue
            echo "删除旧发布：$t"
            gh release delete "$t" --yes --cleanup-tag 2>/dev/null || true
          done

      - name: 创建发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          三个版本放在一起，按需自取：

          | 文件 | 说明 |
          | --- | --- |
          | `LightMirror-2.0.6.apk` | **安卓端**原版，176 KB，直接安装（minSdk 29 / targetSdk 36） |
          | `LightMirror-Desktop-2.4.3.exe` | **电脑端** Python + PySide6 单文件版，35 MB |
          | `LightMirror-Desktop-3.0.0-rust.exe` | **电脑端** Rust + Tauri 便携版，5.4 MB，免安装 |

          安卓端与两个电脑端功能一致（镜像测速、多任务并发、单文件多段并行、断点续传、版本追踪）。
          Rust 版只发布 Windows 桌面版，不再出安卓包。
          EOF
          gh release create "$TAG" dist/* \
            --title "光速镜像 $TAG" \
            --notes-file notes.md
